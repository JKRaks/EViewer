name: Cloudflare release

on:
  push:
    branches: [pre, main]
  pull_request:
    branches: [pre, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:assistant
      - run: node tool/check-assistant-version.mjs
      - run: npm run build
      - name: Check proxy and app entry
        run: npm run check:worker
      - name: Validate production and Preview asset bundles
        run: |
          node deploy/cloudflare/release.mjs --dry-run --branch main --commit "$GITHUB_SHA"
          node deploy/cloudflare/release.mjs --dry-run --branch pre --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          overwrite: true
          retention-days: 3

  release:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref_name == 'pre' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
      - name: Publish fixed pre Preview or Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node deploy/cloudflare/release.mjs --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

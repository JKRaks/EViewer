name: Cloudflare release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 预览关联的 PR 编号（生产留空）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || (github.ref_name != 'main' && inputs.pr) || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NODE_USE_ENV_PROXY: '1'
      RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/eproxy/package-lock.json
      - run: npm ci
      - run: npm ci --prefix deploy/eproxy
      - name: Clean up closed PR
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node deploy/cloudflare/release.mjs --cleanup-pr "$RELEASE_PR" --branch "$RELEASE_BRANCH"
      - name: Build frontend
        if: github.event.action != 'closed'
        run: npm run build
      - name: Check Worker
        if: github.event.action != 'closed'
        run: npm run check --prefix deploy/eproxy
      - name: Publish Worker, then Pages, and verify binding
        if: github.event.action != 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          args=(--branch "$RELEASE_BRANCH" --commit "$RELEASE_COMMIT")
          if [ -n "$RELEASE_PR" ]; then args+=(--pr "$RELEASE_PR"); fi
          node deploy/cloudflare/release.mjs "${args[@]}"

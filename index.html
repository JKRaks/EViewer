  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="application-name" content="EViewer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EViewer">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>EViewer</title>
  <script>
    // Match the saved theme before the application bundle paints.
    try {
      const theme = localStorage.getItem('eviewer-theme')
      document.documentElement.classList.toggle('dark',
        theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
    } catch { /* Theme detection must not block the first paint. */ }
  </script>
  <style>
    #app-launch {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      background: var(--background, #fafafa);
      color: var(--foreground, #292f31);
    }
    html.dark #app-launch {
      background: var(--background, #1e2224);
      color: var(--foreground, #eceeed);
    }
    .launch-wordmark {
      width: min(66vw, 320px);
      height: auto;
      fill: currentColor;
      transform: translateY(-4vh);
    }
    .launch-dot { fill: var(--accent, #285f8c); }
    html.dark .launch-dot { fill: var(--accent, #99c7e5); }
    .launch-stroke {
      opacity: 0;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: launch-write linear both;
    }
    .launch-bloom {
      position: absolute;
      border-radius: 50%;
      background: var(--accent, #285f8c);
      visibility: hidden;
    }
    html.dark .launch-bloom { background: var(--accent, #99c7e5); }
    #app.is-revealing {
      position: relative;
      z-index: 2001;
      background: var(--background, #fafafa);
    }
    @keyframes launch-write {
      from { opacity: 0; stroke-dashoffset: 1; }
      1% { opacity: 1; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .launch-stroke { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>
</head>
